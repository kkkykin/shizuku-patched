name: Build Shizuku (Patched)

on:
  workflow_dispatch:
    inputs:
      shizuku_ref:
        description: 'thedjchi/Shizuku branch, tag, or commit SHA'
        required: true
        default: 'master'
        type: string
      tag_name:
        description: 'Release tag (empty: generated from ref and timestamp)'
        required: false
        default: ''
        type: string
      release_name:
        description: 'Release title'
        required: true
        default: 'Shizuku (Patched)'
        type: string
      prerelease:
        description: 'Mark the GitHub Release as a prerelease'
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ inputs.tag_name || github.run_id }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      tag_name: ${{ steps.metadata.outputs.tag_name }}
    env:
      SHIZUKU_REF: ${{ inputs.shizuku_ref }}
    steps:
      - name: Checkout builder
        uses: actions/checkout@v4

      - name: Checkout Shizuku and its pinned submodules
        uses: actions/checkout@v4
        with:
          repository: thedjchi/Shizuku
          ref: ${{ inputs.shizuku_ref }}
          path: _builder/Shizuku
          submodules: recursive
          fetch-depth: 0
          persist-credentials: false

      - name: Set release tag
        id: metadata
        env:
          INPUT_TAG: ${{ inputs.tag_name }}
        run: |
          tag_name="$INPUT_TAG"
          if [[ -z "$tag_name" ]]; then
            ref_label="$(printf '%s' "$SHIZUKU_REF" | sed 's/[^a-zA-Z0-9._-]/-/g')"
            tag_name="shizuku-patched-${ref_label}-$(date -u +%Y%m%d-%H%M%S)-$GITHUB_RUN_ID"
          fi
          git check-ref-format "refs/tags/$tag_name"
          printf 'tag_name=%s\n' "$tag_name" >> "$GITHUB_OUTPUT"

      - name: Apply main repository and api submodule patches
        run: |
          bash scripts/apply-patches.sh _builder/Shizuku \
            | tee "$RUNNER_TEMP/shizuku-patch-report.txt"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: '16111833'
          packages: 'platform-tools'
          log-accepted-android-sdk-licenses: false

      - name: Install upstream Android build dependencies
        run: python3 scripts/install-android-sdk.py _builder/Shizuku

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Prepare APK signing (emacs-keystore by default)
        id: signing
        env:
          KEYSTORE: ${{ secrets.KEYSTORE }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEYSTORE_ALIAS: ${{ secrets.KEYSTORE_ALIAS }}
          KEYSTORE_ALIAS_PASSWORD: ${{ secrets.KEYSTORE_ALIAS_PASSWORD }}
        run: python3 scripts/prepare-signing.py _builder/Shizuku >> "$GITHUB_OUTPUT"

      - name: Build release APK
        working-directory: _builder/Shizuku
        run: ./gradlew --no-daemon --build-cache :manager:assembleRelease

      - name: Package APK and build information
        env:
          SIGNING_MODE: ${{ steps.signing.outputs.signing }}
          TAG_NAME: ${{ steps.metadata.outputs.tag_name }}
        run: |
          mkdir -p release-assets
          shopt -s nullglob
          apks=(_builder/Shizuku/manager/build/outputs/apk/release/*.apk)
          if (( ${#apks[@]} == 0 )); then
            echo "::error::No release APK produced."
            exit 1
          fi
          for apk in "${apks[@]}"; do
            "$ANDROID_HOME/build-tools/$ANDROID_BUILD_TOOLS/apksigner" verify "$apk"
            filename="${apk##*/}"
            cp "$apk" "release-assets/${filename%.apk}-patched.apk"
          done
          (cd release-assets && sha256sum -- *.apk > SHA256SUMS)
          {
            printf '# Shizuku (Patched)\n\n'
            printf -- '- Upstream: https://github.com/thedjchi/Shizuku\n'
            printf -- '- Ref: `%s`\n' "$SHIZUKU_REF"
            printf -- '- Shizuku commit: `%s`\n' "$(git -C _builder/Shizuku rev-parse HEAD)"
            printf -- '- API commit: `%s`\n' "$(git -C _builder/Shizuku/api rev-parse HEAD)"
            printf -- '- Builder commit: `%s`\n' "$GITHUB_SHA"
            printf -- '- Release tag: `%s`\n' "$TAG_NAME"
            printf -- '- Signing: `%s`\n' "$SIGNING_MODE"
            printf -- '- Build log: %s/%s/actions/runs/%s\n' "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID"
            printf '\n## Patches\n\n'
            printf -- '- main: remove `Entering shell...` from rish stdout.\n'
            printf -- '- api: fix the stderr pipe and wait for stdout/stderr to drain before exiting.\n\n```text\n'
            cat "$RUNNER_TEMP/shizuku-patch-report.txt"
            printf '```\n\n## Patch SHA256\n\n```text\n'
            for patch in patches/main/*.patch patches/main/*.diff patches/api/*.patch patches/api/*.diff; do
              sha256sum "$patch"
            done
            printf '```\n\n## APK SHA256\n\n```text\n'
            cat release-assets/SHA256SUMS
            printf '```\n'
          } > release-assets/release-notes.md

      - name: Remove signing material
        if: always()
        run: |
          rm -f -- "$RUNNER_TEMP/shizuku-patched-signing.jks" \
            _builder/Shizuku/signing.properties

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: shizuku-patched
          path: release-assets/
          if-no-files-found: error
          retention-days: 7

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout builder
        uses: actions/checkout@v4

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: shizuku-patched
          path: release-assets

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG_NAME: ${{ needs.build.outputs.tag_name }}
          RELEASE_NAME: ${{ inputs.release_name }}
          IS_PRERELEASE: ${{ inputs.prerelease }}
        run: |
          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            gh release upload "$TAG_NAME" release-assets/*.apk release-assets/SHA256SUMS --clobber
            gh release edit "$TAG_NAME" \
              --title "$RELEASE_NAME ($TAG_NAME)" \
              --notes-file release-assets/release-notes.md \
              --prerelease="$IS_PRERELEASE"
          else
            extra_args=()
            if [[ "$IS_PRERELEASE" == true ]]; then
              extra_args+=(--prerelease)
            fi
            gh release create "$TAG_NAME" release-assets/*.apk release-assets/SHA256SUMS \
              --target "$GITHUB_SHA" \
              --title "$RELEASE_NAME ($TAG_NAME)" \
              --notes-file release-assets/release-notes.md \
              "${extra_args[@]}"
          fi
